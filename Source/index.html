<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2b20">
  <meta name="description" content="«Тысяча» — карточная игра на троих: локально против двух AI-соперников или по локальной сети с друзьями.">
  <title>1000 — Тысяча</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/game-ui.css">
  <link rel="stylesheet" href="css/content.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/network.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand" aria-label="Тысяча">
        <span class="brand__mark" aria-hidden="true">1000</span>
        <span class="brand__copy">
          <span class="brand__title">Тысяча</span>
          <span class="brand__tagline">Игра на троих</span>
        </span>
      </div>

      <div class="app-header__meta">
        <span class="pill">
          <span class="pill__label">Цель</span> До <span id="target-score">1000</span>
        </span>
        <span class="pill pill--quiet">
          <span class="pill__label">Раздача</span> <span id="deal-number">—</span>
        </span>
      </div>

      <div class="app-header__actions">
        <button
          class="button button--ghost log-toggle"
          type="button"
          id="log-toggle"
          aria-controls="game-log-panel"
          aria-expanded="false"
        >Журнал</button>
        <button class="button button--ghost" type="button" id="rules">Правила</button>
        <button class="button button--ghost" type="button" id="settings">Настройки</button>
        <button class="button button--ghost" type="button" id="network">Сетевая игра</button>
        <button class="button" type="button" id="new-game">Новая игра</button>
      </div>
    </header>

    <main class="game" id="game">
      <section class="game__board" aria-label="Игровой стол">
        <div class="opponents" id="opponents"></div>
        <div class="table-center" id="table-center"></div>
        <div id="human-panel"></div>
        <div class="action-bar" id="action-bar" tabindex="-1"></div>
        <section class="hand" id="hand" aria-label="Ваши карты"></section>
      </section>

      <aside class="sidebar" id="game-log-panel" aria-label="Журнал событий" tabindex="-1">
        <div class="sidebar__head">
          <h2 class="sidebar__title">Журнал</h2>
          <span class="sidebar__hint">Партия</span>
          <button
            class="sidebar__close"
            type="button"
            id="log-close"
            aria-label="Закрыть журнал"
          >×</button>
        </div>
        <div class="game-log" id="game-log" role="log" aria-live="polite" aria-relevant="additions"></div>
      </aside>
    </main>

    <footer class="app-footer">
      <span>Версия 1.2.0 · локальная игра или сеть по локальной сети</span>
      <span aria-hidden="true">♠ ♥ ♦ ♣</span>
    </footer>
  </div>

  <div class="sidebar-backdrop" id="log-backdrop" hidden></div>
  <div id="modal-root"></div>
  <div class="toast-root" id="toast-root" role="status" aria-live="polite"></div>
  <div class="visually-hidden" id="game-announcer" role="status" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <div class="noscript">Для игры нужен JavaScript. Включите его в настройках браузера.</div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
